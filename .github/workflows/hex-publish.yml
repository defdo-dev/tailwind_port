name: Hex.pm Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  validate-and-test:
    name: Validate and Test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        otp: ['28.1']
        elixir: ['1.19']
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup Elixir
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp }}
        elixir-version: ${{ matrix.elixir }}
        version-type: loose
        install-hex: true
        install-rebar: true
    
    - name: Validate version in mix.exs
      run: |
        # Extract version from tag, handling both v-prefixed and non-prefixed tags
        TAG_REF=${GITHUB_REF#refs/tags/}
        if [[ $TAG_REF == v* ]]; then
          TAG_VERSION=${TAG_REF#v}
        else
          TAG_VERSION=$TAG_REF
        fi
        
        MIX_VERSION=$(grep -o 'version: "[^"]*"' mix.exs | cut -d'"' -f2)
        
        if [ "$TAG_VERSION" != "$MIX_VERSION" ]; then
          echo "❌ Version mismatch: tag=$TAG_VERSION, mix.exs=$MIX_VERSION"
          exit 1
        fi
        
        echo "✅ Version validation passed: $TAG_VERSION"
    
    - uses: actions/cache@v5
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-
    
    - name: Install dependencies
      run: mix deps.get
    
    - name: Download Tailwind CSS binary
      env:
        # Pinned, not `releases/latest`: an unpinned URL means CI runs against
        # whatever upstream shipped today, and nothing records which that was.
        TAILWIND_CLI_VERSION: '4.3.3'
      run: |
        mkdir -p priv/bin
        curl -sLo priv/bin/tailwindcss \
          "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWIND_CLI_VERSION}/tailwindcss-linux-x64"
        chmod +x priv/bin/tailwindcss
        priv/bin/tailwindcss --help | head -1
    
    - name: Run tests
      run: mix test
    
    - name: Check code quality
      run: |
        mix format --check-formatted
        mix credo --strict

  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-24.04
    needs: validate-and-test
    environment: production
    strategy:
      matrix:
        otp: ['28.1']
        elixir: ['1.19']
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup Elixir
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp }}
        elixir-version: ${{ matrix.elixir }}
        version-type: loose
        install-hex: true
        install-rebar: true
    
    - uses: actions/cache@v5
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-
    
    - name: Install dependencies
      run: |
        mix deps.get --only prod
    
    - name: Download Tailwind CSS binary
      run: |
        mkdir -p priv/bin
        curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
        chmod +x tailwindcss-linux-x64
        mv tailwindcss-linux-x64 priv/bin/tailwindcss
    
    - name: Publish to Hex.pm
      env:
        HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      run: |
        # Extract version from tag, handling both v-prefixed and non-prefixed tags
        TAG_REF=${GITHUB_REF#refs/tags/}
        if [[ $TAG_REF == v* ]]; then
          TAG_VERSION=${TAG_REF#v}
        else
          TAG_VERSION=$TAG_REF
        fi
        echo "Publishing version $TAG_VERSION to Hex.pm"
        mix hex.publish --yes

  notify-discord:
    name: Discord Notification
    runs-on: ubuntu-24.04
    # publish-docs is continue-on-error, so the RUN goes green even when it
    # fails. Depend on it here or a broken docs credential is announced nowhere.
    needs: [validate-and-test, publish, publish-docs]
    if: always()
    steps:
    - name: Send success notification
      if: ${{ needs.publish.result == 'success' }}
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      uses: Ilshidur/action-discord@master
      with:
        args: |
          🎉 **New Release Published** - TailwindPort ${{ github.ref_name }}
          
          📦 **Package:** https://hex.pm/packages/tailwind_port
          📚 **Documentation:** https://hexdocs.pm/tailwind_port/${{ github.ref_name }}
          🏷️ **GitHub Release:** ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          
          **Installation:**
          ```elixir
          def deps do
            [
              {:tailwind_port, "~> ${{ github.ref_name }}"}
            ]
          end
          ```
          
          Ready for production use! 🚀
          ${{ needs.publish-docs.result != 'success' && '⚠️ Docs upload FAILED — see the run summary.' || '' }}

    - name: Send failure notification
      if: ${{ needs.validate-and-test.result == 'failure' || needs.publish.result == 'failure' || needs.publish-docs.result == 'failure' }}
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      uses: Ilshidur/action-discord@master
      with:
        args: |
          ❌ **Release Failed** - TailwindPort ${{ github.ref_name }}
          
          **Failed Jobs:**
          ${{ needs.validate-and-test.result == 'failure' && '❌ Tests/Validation' || '✅ Tests/Validation' }}
          ${{ needs.publish.result == 'failure' && '❌ Hex.pm Publish' || '✅ Hex.pm Publish' }}
          ${{ needs.publish-docs.result == 'failure' && '❌ Docs Publish' || '✅ Docs Publish' }}
          
          Please check the workflow logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  publish-docs:
    name: Publish docs to foss.defdo.ninja
    runs-on: ubuntu-24.04
    needs: publish
    # Non-blocking until the docs portal is live and FOSS_PUBLISH_TOKEN exists
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
    - uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.19'
        otp-version: '28.1'
        version-type: loose
    - name: Build and publish docs
      env:
        HEX_ORG_TOKEN: ${{ secrets.HEX_ORG_TOKEN }}
        FOSS_PUBLISH_TOKEN: ${{ secrets.FOSS_PUBLISH_TOKEN }}
      run: |
        mix local.hex --force && mix local.rebar --force
        if [ -n "$HEX_ORG_TOKEN" ]; then mix hex.organization auth defdo --key "$HEX_ORG_TOKEN"; fi
        mix deps.get
        mix docs
        tar -czf docs.tar.gz -C doc .

        if [ -z "$FOSS_PUBLISH_TOKEN" ]; then
          echo "::notice::FOSS_PUBLISH_TOKEN is not set; skipping the docs upload."
          echo "- docs upload skipped: no FOSS_PUBLISH_TOKEN" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # A token IS set, so a rejection is a broken credential, not a portal
        # that has not launched. Say which, in the run summary, not only in the log.
        HTTP_CODE=$(curl -s -o upload.log -w '%{http_code}' -X POST \
          -H "Authorization: Bearer $FOSS_PUBLISH_TOKEN" \
          -H "Content-Type: application/gzip" \
          --data-binary @docs.tar.gz \
          "https://foss.defdo.ninja/api/packages/tailwind_port/${GITHUB_REF_NAME}/docs")

        if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
          echo "- docs published to foss.defdo.ninja (HTTP $HTTP_CODE)" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
          echo "::error::Docs upload rejected with HTTP $HTTP_CODE. FOSS_PUBLISH_TOKEN is expired or revoked."
          echo "- **docs upload FAILED: HTTP $HTTP_CODE — FOSS_PUBLISH_TOKEN expired or revoked**" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::error::Docs upload failed with HTTP $HTTP_CODE."
          echo "- **docs upload FAILED: HTTP $HTTP_CODE**" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit 1
