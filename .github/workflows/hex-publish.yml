name: Hex.pm Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  validate-and-test:
    name: Validate and Test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        otp: ['28.1']
        elixir: ['1.19']
    steps:
    - uses: actions/checkout@v6
    
    - name: Setup Elixir
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp }}
        elixir-version: ${{ matrix.elixir }}
        version-type: loose
        install-hex: true
        install-rebar: true
    
    - name: Validate version in mix.exs
      run: |
        # Extract version from tag, handling both v-prefixed and non-prefixed tags
        TAG_REF=${GITHUB_REF#refs/tags/}
        if [[ $TAG_REF == v* ]]; then
          TAG_VERSION=${TAG_REF#v}
        else
          TAG_VERSION=$TAG_REF
        fi
        
        MIX_VERSION=$(grep -o 'version: "[^"]*"' mix.exs | cut -d'"' -f2)
        
        if [ "$TAG_VERSION" != "$MIX_VERSION" ]; then
          echo "❌ Version mismatch: tag=$TAG_VERSION, mix.exs=$MIX_VERSION"
          exit 1
        fi
        
        echo "✅ Version validation passed: $TAG_VERSION"
    
    - uses: actions/cache@v5
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-
    
    - name: Install dependencies
      run: mix deps.get
    
    - name: Download Tailwind CSS binary
      run: |
        mkdir -p priv/bin
        curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
        chmod +x tailwindcss-linux-x64
        mv tailwindcss-linux-x64 priv/bin/tailwindcss
    
    - name: Run tests
      run: mix test
    
    - name: Check code quality
      run: |
        mix format --check-formatted
        mix credo --strict

  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-24.04
    needs: validate-and-test
    environment: production
    strategy:
      matrix:
        otp: ['28.1']
        elixir: ['1.19']
    steps:
    - uses: actions/checkout@v6
    
    - name: Setup Elixir
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp }}
        elixir-version: ${{ matrix.elixir }}
        version-type: loose
        install-hex: true
        install-rebar: true
    
    - uses: actions/cache@v5
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-
    
    - name: Install dependencies
      run: |
        mix deps.get --only prod
    
    - name: Download Tailwind CSS binary
      run: |
        mkdir -p priv/bin
        curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
        chmod +x tailwindcss-linux-x64
        mv tailwindcss-linux-x64 priv/bin/tailwindcss
    
    - name: Publish to Hex.pm
      env:
        HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      run: |
        # Extract version from tag, handling both v-prefixed and non-prefixed tags
        TAG_REF=${GITHUB_REF#refs/tags/}
        if [[ $TAG_REF == v* ]]; then
          TAG_VERSION=${TAG_REF#v}
        else
          TAG_VERSION=$TAG_REF
        fi
        echo "Publishing version $TAG_VERSION to Hex.pm"
        mix hex.publish --yes

  notify-discord:
    name: Discord Notification
    runs-on: ubuntu-24.04
    needs: [validate-and-test, publish]
    if: always()
    steps:
    - name: Send success notification
      if: ${{ needs.publish.result == 'success' }}
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      uses: Ilshidur/action-discord@master
      with:
        args: |
          🎉 **New Release Published** - TailwindPort ${{ github.ref_name }}
          
          📦 **Package:** https://hex.pm/packages/tailwind_port
          📚 **Documentation:** https://hexdocs.pm/tailwind_port/${{ github.ref_name }}
          🏷️ **GitHub Release:** ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          
          **Installation:**
          ```elixir
          def deps do
            [
              {:tailwind_port, "~> ${{ github.ref_name }}"}
            ]
          end
          ```
          
          Ready for production use! 🚀

    - name: Send failure notification
      if: ${{ needs.validate-and-test.result == 'failure' || needs.publish.result == 'failure' }}
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      uses: Ilshidur/action-discord@master
      with:
        args: |
          ❌ **Release Failed** - TailwindPort ${{ github.ref_name }}
          
          **Failed Jobs:**
          ${{ needs.validate-and-test.result == 'failure' && '❌ Tests/Validation' || '✅ Tests/Validation' }}
          ${{ needs.publish.result == 'failure' && '❌ Hex.pm Publish' || '✅ Hex.pm Publish' }}
          
          Please check the workflow logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  publish-docs:
    name: Publish docs to foss.defdo.ninja
    runs-on: ubuntu-24.04
    needs: publish
    # Non-blocking until the docs portal is live and FOSS_PUBLISH_TOKEN exists
    continue-on-error: true
    steps:
    - uses: actions/checkout@v6
    - uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.19'
        otp-version: '28.1'
        version-type: loose
    - name: Build and publish docs
      env:
        HEX_ORG_TOKEN: ${{ secrets.HEX_ORG_TOKEN }}
        FOSS_PUBLISH_TOKEN: ${{ secrets.FOSS_PUBLISH_TOKEN }}
      run: |
        mix local.hex --force && mix local.rebar --force
        if [ -n "$HEX_ORG_TOKEN" ]; then mix hex.organization auth defdo --key "$HEX_ORG_TOKEN"; fi
        mix deps.get
        mix docs
        tar -czf docs.tar.gz -C doc .
        curl --fail -X POST \
          -H "Authorization: Bearer $FOSS_PUBLISH_TOKEN" \
          -H "Content-Type: application/gzip" \
          --data-binary @docs.tar.gz \
          "https://foss.defdo.ninja/api/packages/tailwind_port/${GITHUB_REF_NAME}/docs"
