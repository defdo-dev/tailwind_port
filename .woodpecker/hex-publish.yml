---
# Hex publish pipeline: publishes tailwind_port to the private `defdo` Hex
# organization.
#
# Migrated from GitHub Actions (.github/workflows/hex-publish.yml), whose
# HEX_API_KEY secret was revoked. Same shape as tailwind_compiler's pipeline.
#
# Secrets (global Woodpecker secrets):
#   hex_api_key          Hex user API key with publish rights on the defdo org
#   foss_publish_token   optional; docs upload to foss.defdo.ninja (non-blocking)
#
# Triggers:
#   - tag push (e.g. `0.6.1`): the tag must equal the version in mix.exs.
#   - manual run with PUBLISH_VERSION=<x.y.z>: publishes an EXISTING tag whose
#     own commit predates this pipeline (0.6.0 was tagged before the migration).
#     It only proceeds when PUBLISH_VERSION equals mix.exs AND the tag exists AND
#     lib/, mix.exs and mix.lock are byte-identical between the tag and the
#     checked-out commit, so what ships is exactly what was tagged.
#
# `platform: linux/amd64` is REQUIRED (see ci.yml).

labels:
  platform: linux/amd64

when:
  - event: tag
  - event: manual
    evaluate: 'PUBLISH_VERSION != ""'

steps:
  - name: validate
    image: elixir:1.19.5
    environment:
      TAILWIND_CLI_VERSION: "4.3.3"
    commands:
      - |
        set -e
        apt-get update -y && apt-get install -y --no-install-recommends curl git build-essential
        MIX_VERSION="$(grep -o 'version: "[^"]*"' mix.exs | head -1 | cut -d'"' -f2)"
        if [ -n "$${CI_COMMIT_TAG}" ]; then
          VERSION="$${CI_COMMIT_TAG#v}"
        else
          VERSION="$${PUBLISH_VERSION}"
          git fetch --tags --force origin
          git rev-parse -q --verify "refs/tags/$${VERSION}" >/dev/null || { echo "ERROR: tag $${VERSION} does not exist"; exit 1; }
          if ! git diff --quiet "$${VERSION}" HEAD -- lib mix.exs mix.lock; then
            echo "ERROR: lib/, mix.exs or mix.lock differ between tag $${VERSION} and HEAD"; exit 1
          fi
        fi
        if [ "$${VERSION}" != "$${MIX_VERSION}" ]; then
          echo "ERROR: version mismatch: release=$${VERSION} mix.exs=$${MIX_VERSION}"; exit 1
        fi
        echo "version validation passed: $${VERSION}"
        mix local.hex --force
        mix local.rebar --force
        sh scripts/ci/deps-get.sh
        mkdir -p priv/bin
        curl -sfLo priv/bin/tailwindcss \
          "https://github.com/tailwindlabs/tailwindcss/releases/download/v$${TAILWIND_CLI_VERSION}/tailwindcss-linux-x64"
        chmod +x priv/bin/tailwindcss
        mix compile --warnings-as-errors
        MIX_ENV=test mix test
        mix hex.build

  - name: hex-publish
    image: elixir:1.19.5
    depends_on: [validate]
    environment:
      HEX_API_KEY:
        from_secret: hex_api_key
    commands:
      - |
        set -e
        if [ -z "$${HEX_API_KEY}" ]; then echo "ERROR: HEX_API_KEY is required to publish"; exit 1; fi
        mix local.hex --force
        mix local.rebar --force
        sh scripts/ci/deps-get.sh --only prod
        # Package and docs are published SEPARATELY on purpose: `mix hex.publish`
        # does both, and when its docs phase re-submits the release Hex answers
        # "must include the --replace flag", turning a published release red.
        mix hex.publish package --yes
        mix hex.publish docs --yes

  - name: publish-docs-foss
    image: elixir:1.19.5
    depends_on: [hex-publish]
    failure: ignore
    environment:
      FOSS_PUBLISH_TOKEN:
        from_secret: foss_publish_token
    commands:
      - |
        set -e
        if [ -z "$${FOSS_PUBLISH_TOKEN}" ]; then echo "foss_publish_token not set; skipping docs upload"; exit 0; fi
        apt-get update -y && apt-get install -y --no-install-recommends curl
        VERSION="$${CI_COMMIT_TAG:-$${PUBLISH_VERSION}}"
        mix local.hex --force && mix local.rebar --force
        sh scripts/ci/deps-get.sh
        mix docs
        tar -czf docs.tar.gz -C doc .
        HTTP_CODE=$(curl -s -o upload.log -w '%{http_code}' -X POST \
          -H "Authorization: Bearer $${FOSS_PUBLISH_TOKEN}" \
          -H "Content-Type: application/gzip" \
          --data-binary @docs.tar.gz \
          "https://foss.defdo.ninja/api/packages/tailwind_port/$${VERSION}/docs")
        if [ "$${HTTP_CODE}" -ge 200 ] && [ "$${HTTP_CODE}" -lt 300 ]; then echo "docs published (HTTP $${HTTP_CODE})"; exit 0; fi
        echo "docs upload failed (HTTP $${HTTP_CODE})"; exit 1
